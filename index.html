<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nifty Futures · Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b14; --bg2:#0b0f1c;
    --panel:rgba(255,255,255,.028); --panel-brd:rgba(255,255,255,.075);
    --ink:#eaf0fb; --mut:#7d8aa6; --faint:#4a556e;
    --teal:#4fe0c4; --teal-dim:#1f6f63;
    --gold:#f3ba57;
    --up:#3ddc97; --dn:#fb7185;
    --grid:rgba(255,255,255,.045);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--body);
    -webkit-font-smoothing:antialiased; padding:clamp(16px,4vw,44px);
    display:flex; justify-content:center; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(680px 480px at 12% -6%, rgba(79,224,196,.10), transparent 60%),
      radial-gradient(720px 520px at 108% 112%, rgba(243,186,87,.07), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.4;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px; -webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 78%);
            mask-image:radial-gradient(circle at 50% 30%,#000,transparent 78%);
  }
  .wrap{width:100%;max-width:760px}

  /* ---- top bar ---- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
  .brand{display:flex;align-items:center;gap:13px}
  .live{width:9px;height:9px;border-radius:50%;background:var(--teal);position:relative;flex:none}
  .live::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--teal);opacity:.35;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.4);opacity:0}}
  .brand h1{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1}
  .brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--faint);text-transform:uppercase;margin-bottom:5px}
  .badges{display:flex;align-items:center;gap:9px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid var(--panel-brd);color:var(--mut);white-space:nowrap}
  .chip.paper{border-color:rgba(243,186,87,.35);color:var(--gold)}
  .chip.st-flat{color:var(--mut)}
  .chip.st-trade{border-color:rgba(79,224,196,.4);color:var(--teal)}

  /* ---- hero ---- */
  .hero{padding:6px 2px 26px}
  .hero .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
  .equity{font-family:var(--mono);font-weight:700;font-size:clamp(44px,9vw,74px);letter-spacing:-.02em;line-height:.95;font-variant-numeric:tabular-nums}
  .equity .rs{color:var(--faint);font-weight:500;font-size:.5em;vertical-align:.14em;margin-right:.12em}
  .delta{display:inline-flex;align-items:center;gap:9px;margin-top:16px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
  .delta .arrow{font-size:13px}
  .delta .sep{width:1px;height:15px;background:var(--panel-brd)}
  .up{color:var(--up)} .dn{color:var(--dn)}
  .glowline{height:1px;margin-top:24px;background:linear-gradient(90deg,transparent,var(--teal-dim),transparent);opacity:.6}

  /* ---- kpi strip ---- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
  .kpi{background:var(--panel);border:1px solid var(--panel-brd);border-radius:14px;padding:15px 16px;backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .kpi:nth-child(1){animation-delay:.05s}.kpi:nth-child(2){animation-delay:.12s}
  .kpi:nth-child(3){animation-delay:.19s}.kpi:nth-child(4){animation-delay:.26s}
  @keyframes rise{to{opacity:1;transform:none}}
  .kpi .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .kpi .v{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .v small{font-size:12px;color:var(--mut);font-weight:400}

  /* ---- chart panel ---- */
  .panel{background:var(--panel);border:1px solid var(--panel-brd);border-radius:18px;padding:20px 20px 14px;backdrop-filter:blur(8px)}
  .panel .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .panel .title{font-family:var(--disp);font-weight:500;font-size:14px;color:var(--ink)}
  .panel .peaks{font-family:var(--mono);font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
  .chartbox{position:relative}
  svg.chart{width:100%;height:210px;display:block;overflow:visible}
  .empty{font-family:var(--mono);font-size:12px;color:var(--faint);text-align:center;padding:74px 0;letter-spacing:.05em}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:0 4px}
  .foot span{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}

  @media (max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .badges .chip.paper{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <span class="live" id="live"></span>
      <div>
        <div class="eyebrow">Paper Desk</div>
        <h1 id="name">Nifty Futures</h1>
      </div>
    </div>
    <div class="badges">
      <span class="chip paper">Paper</span>
      <span class="chip st-flat" id="status">—</span>
    </div>
  </div>

  <div class="hero">
    <div class="lbl">Account Equity</div>
    <div class="equity"><span class="rs">₹</span><span id="equity">0</span></div>
    <div class="delta" id="delta">
      <span class="arrow"></span><span id="pnl">—</span>
      <span class="sep"></span><span id="pnlpct">—</span>
    </div>
    <div class="glowline"></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="k">Net P&amp;L</div><div class="v" id="k_pnl">—</div></div>
    <div class="kpi"><div class="k">Return</div><div class="v" id="k_ret">—</div></div>
    <div class="kpi"><div class="k">Trades</div><div class="v" id="k_tr">—</div></div>
    <div class="kpi"><div class="k">Win Rate</div><div class="v" id="k_wr">—</div></div>
  </div>

  <div class="panel">
    <div class="head">
      <div class="title">Equity curve</div>
      <div class="peaks" id="peaks"></div>
    </div>
    <div class="chartbox">
      <svg class="chart" id="chart" viewBox="0 0 800 210" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="empty" id="empty">Awaiting first trade</div>
    </div>
  </div>

  <div class="foot">
    <span id="updated">—</span>
    <span>Paper trading · not investment advice</span>
  </div>

</div>

<script>
const IN = n => Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const INd = n => (n>=0?"+":"−")+"₹"+IN(Math.abs(n));

function animateNumber(el, to, dur=900){
  const from = 0, t0 = performance.now();
  const ease = x => 1-Math.pow(1-x,3);
  function step(t){
    const p = Math.min(1,(t-t0)/dur);
    el.textContent = IN(from+(to-from)*ease(p));
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function drawChart(capital, curve){
  const svg = document.getElementById("chart");
  const empty = document.getElementById("empty");
  const vals = [capital, ...curve.map(p=>p[1])];
  if(vals.length < 2){ svg.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";
  const W=800,H=210,pad=10;
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const X=i=>pad+i*(W-2*pad)/(vals.length-1);
  const Y=v=>H-pad-(v-min)/rng*(H-2*pad);
  const line=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const area=line+` L${X(vals.length-1).toFixed(1)} ${H-pad} L${X(0).toFixed(1)} ${H-pad} Z`;
  const last=vals[vals.length-1];
  const pos = last>=capital;
  const stroke = pos ? "#4fe0c4" : "#fb7185";
  const fillId = pos ? "gpos" : "gneg";
  const baseY=Y(capital).toFixed(1);
  const len = 2000;
  svg.innerHTML = `
    <defs>
      <linearGradient id="gpos" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4fe0c4" stop-opacity=".28"/>
        <stop offset="1" stop-color="#4fe0c4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gneg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fb7185" stop-opacity=".26"/>
        <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="rgba(255,255,255,.16)" stroke-width="1" stroke-dasharray="2 5" vector-effect="non-scaling-stroke"/>
    <path d="${area}" fill="url(#${fillId})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" vector-effect="non-scaling-stroke"
          filter="url(#glow)" stroke-linejoin="round" stroke-linecap="round"
          style="stroke-dasharray:${len};stroke-dashoffset:${len};animation:draw 1.25s .15s ease-out forwards"/>
    <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.6" fill="${stroke}" filter="url(#glow)"
            style="opacity:0;animation:dot .3s 1.3s forwards"/>
    <style>@keyframes draw{to{stroke-dashoffset:0}}@keyframes dot{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){path{animation:none!important;stroke-dashoffset:0!important}circle{opacity:1!important}}</style>`;
  // peak / drawdown
  let peak=-Infinity, mdd=0, run=-Infinity;
  for(const v of vals){ run=Math.max(run,v); mdd=Math.max(mdd,(run-v)); peak=Math.max(peak,v); }
  const mddPct = (mdd/ (peak||1) *100);
  document.getElementById("peaks").innerHTML =
    `peak ₹${IN(peak)} &nbsp;·&nbsp; max DD ${mddPct.toFixed(1)}%`;
}

async function load(){
  let d;
  try{ d = await (await fetch("data.json?t="+Date.now())).json(); }
  catch(e){ return; }
  document.getElementById("name").textContent = d.name;
  animateNumber(document.getElementById("equity"), d.equity);

  const status = document.getElementById("status");
  const inTrade = (d.status||"").toUpperCase().includes("TRADE");
  status.textContent = d.status;
  status.className = "chip " + (inTrade ? "st-trade" : "st-flat");
  document.getElementById("live").style.background = inTrade ? "#f3ba57" : "#4fe0c4";

  const up = d.pnl >= 0;
  const delta = document.getElementById("delta");
  delta.className = "delta " + (up?"up":"dn");
  delta.querySelector(".arrow").textContent = up ? "▲" : "▼";
  document.getElementById("pnl").textContent = INd(d.pnl);
  document.getElementById("pnlpct").textContent = (up?"+":"")+d.pnl_pct+"%";

  const kp=document.getElementById("k_pnl"); kp.textContent=INd(d.pnl); kp.className="v "+(up?"up":"dn");
  const kr=document.getElementById("k_ret"); kr.textContent=(up?"+":"")+d.pnl_pct+"%"; kr.className="v "+(up?"up":"dn");
  document.getElementById("k_tr").innerHTML = d.trades;
  document.getElementById("k_wr").innerHTML = d.win_rate+'<small>%</small>';

  document.getElementById("updated").textContent = "Updated "+d.updated;
  drawChart(d.capital, d.equity_curve||[]);
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
